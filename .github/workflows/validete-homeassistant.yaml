name: Validate Home Assistant Integration

on:
  #push:
  #pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort hassfest

      # 🔍 Struktur + Manifest + HA-Regeln prüfen
      - name: Run hassfest
        run: hassfest

      # 🧹 Linting (schnell & modern)
      - name: Run ruff
        run: ruff check .

      # 🎨 Format prüfen (ohne zu ändern)
      - name: Check formatting with black
        run: black --check .

      # 📦 Import-Reihenfolge prüfen
      - name: Check imports with isort
        run: isort --check-only .
